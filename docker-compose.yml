services:
  avito-manager:
    build: .
    container_name: avito-dropshipping-manager
    restart: unless-stopped
    ports:
      - "4317:4317"
    environment:
      DATABASE_URL: "file:./../data/prod.db"
      APP_PUBLIC_URL: "https://amsterdam2.sebog1.ru"
      APP_PORT: "4317"
      AVITO_API_BASE_URL: "https://api.avito.ru"
      AVITO_REDIRECT_URL: "https://amsterdam2.sebog1.ru/api/avito/oauth/callback"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-replace-this-before-production}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
    volumes:
      - ./data:/app/data
