version: "3.8"

services:
  avito-manager:
    image: seb0g1shopchik:latest
    build: .
    container_name: seb0g1shopchik
    restart: unless-stopped
    ports:
      - "4317:4317"
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL}"
      APP_PORT: "${APP_PORT}"
      AVITO_API_BASE_URL: "${AVITO_API_BASE_URL}"
      AVITO_REDIRECT_URL: "${AVITO_REDIRECT_URL}"
      AVITO_ACCOUNT_ID: "${AVITO_ACCOUNT_ID}"
      AVITO_CLIENT_ID: "${AVITO_CLIENT_ID}"
      AVITO_CLIENT_SECRET: "${AVITO_CLIENT_SECRET}"
      AVITO_REVIEWS_LIST_PATH: "${AVITO_REVIEWS_LIST_PATH}"
      AVITO_REVIEW_DETAIL_PATH: "${AVITO_REVIEW_DETAIL_PATH}"
      AVITO_REVIEW_REPLY_PATH: "${AVITO_REVIEW_REPLY_PATH}"
      AVITO_ONLINE_PRESENCE_PATH: "${AVITO_ONLINE_PRESENCE_PATH}"
      AVITO_AUTOLOAD_PROFILE_PATH: "${AVITO_AUTOLOAD_PROFILE_PATH}"
      AVITO_AUTOLOAD_UPLOAD_PATH: "${AVITO_AUTOLOAD_UPLOAD_PATH}"
      AVITO_AUTOLOAD_REPORTS_PATH: "${AVITO_AUTOLOAD_REPORTS_PATH}"
      AVITO_AUTOLOAD_REPORT_PATH: "${AVITO_AUTOLOAD_REPORT_PATH}"
      AVITO_AUTOLOAD_LAST_REPORT_PATH: "${AVITO_AUTOLOAD_LAST_REPORT_PATH}"
      AVITO_AUTOLOAD_REPORT_ITEMS_PATH: "${AVITO_AUTOLOAD_REPORT_ITEMS_PATH}"
      AVITO_MESSENGER_CHATS_PATH: "${AVITO_MESSENGER_CHATS_PATH}"
      AVITO_MESSENGER_MESSAGES_PATH: "${AVITO_MESSENGER_MESSAGES_PATH}"
      AVITO_MESSENGER_SEND_PATH: "${AVITO_MESSENGER_SEND_PATH}"
      AVITO_ORDERS_LIST_PATH: "${AVITO_ORDERS_LIST_PATH}"
      AVITO_ORDER_DETAIL_PATH: "${AVITO_ORDER_DETAIL_PATH}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL}"
    volumes:
      - ./data:/app/data

  avito-worker:
    image: seb0g1shopchik:latest
    build: .
    container_name: seb0g1shopchik-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      - avito-manager
    env_file:
      - .env
    environment:
      APP_INTERNAL_URL: "http://avito-manager:4317"
      DATABASE_URL: "${DATABASE_URL}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL}"
      AVITO_API_BASE_URL: "${AVITO_API_BASE_URL}"
      AVITO_REDIRECT_URL: "${AVITO_REDIRECT_URL}"
      AVITO_ACCOUNT_ID: "${AVITO_ACCOUNT_ID}"
      AVITO_CLIENT_ID: "${AVITO_CLIENT_ID}"
      AVITO_CLIENT_SECRET: "${AVITO_CLIENT_SECRET}"
      AVITO_REVIEWS_LIST_PATH: "${AVITO_REVIEWS_LIST_PATH}"
      AVITO_REVIEW_DETAIL_PATH: "${AVITO_REVIEW_DETAIL_PATH}"
      AVITO_REVIEW_REPLY_PATH: "${AVITO_REVIEW_REPLY_PATH}"
      AVITO_ONLINE_PRESENCE_PATH: "${AVITO_ONLINE_PRESENCE_PATH}"
      AVITO_AUTOLOAD_PROFILE_PATH: "${AVITO_AUTOLOAD_PROFILE_PATH}"
      AVITO_AUTOLOAD_UPLOAD_PATH: "${AVITO_AUTOLOAD_UPLOAD_PATH}"
      AVITO_AUTOLOAD_REPORTS_PATH: "${AVITO_AUTOLOAD_REPORTS_PATH}"
      AVITO_AUTOLOAD_REPORT_PATH: "${AVITO_AUTOLOAD_REPORT_PATH}"
      AVITO_AUTOLOAD_LAST_REPORT_PATH: "${AVITO_AUTOLOAD_LAST_REPORT_PATH}"
      AVITO_AUTOLOAD_REPORT_ITEMS_PATH: "${AVITO_AUTOLOAD_REPORT_ITEMS_PATH}"
      AVITO_MESSENGER_CHATS_PATH: "${AVITO_MESSENGER_CHATS_PATH}"
      AVITO_MESSENGER_MESSAGES_PATH: "${AVITO_MESSENGER_MESSAGES_PATH}"
      AVITO_MESSENGER_SEND_PATH: "${AVITO_MESSENGER_SEND_PATH}"
      AVITO_ORDERS_LIST_PATH: "${AVITO_ORDERS_LIST_PATH}"
      AVITO_ORDER_DETAIL_PATH: "${AVITO_ORDER_DETAIL_PATH}"
      AVITO_WORKER_ONLINE_INTERVAL_SECONDS: "${AVITO_WORKER_ONLINE_INTERVAL_SECONDS}"
      AVITO_WORKER_REVIEWS_INTERVAL_SECONDS: "${AVITO_WORKER_REVIEWS_INTERVAL_SECONDS}"
      AVITO_WORKER_MESSAGES_INTERVAL_SECONDS: "${AVITO_WORKER_MESSAGES_INTERVAL_SECONDS}"
      AVITO_WORKER_REPORTS_INTERVAL_SECONDS: "${AVITO_WORKER_REPORTS_INTERVAL_SECONDS}"
      AVITO_WORKER_ORDERS_INTERVAL_SECONDS: "${AVITO_WORKER_ORDERS_INTERVAL_SECONDS}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL}"
    volumes:
      - ./data:/app/data
